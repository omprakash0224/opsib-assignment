[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict

filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore::DeprecationWarning:starlette.testclient
    ignore::sqlalchemy.exc.SAWarning:tests.conftest
    ignore::sqlalchemy.exc.SAWarning

markers =
    unit: Fast unit tests without database or network dependencies
    integration: Database integration tests
    idempotency: Ingestion and workflow retry idempotency tests
    failure_path: Data quality, malformed input, and exception failure path tests
    scenario: Assessment scenario verifications (PO-501 through PO-506)
    ai: AI boundary, OpenRouter client, and citation guardrail tests
